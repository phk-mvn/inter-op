[package]
name = "inter-op"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
light-core = { path = "../core" }
light-backend-webview2 = { path = "../backend-webview2" }
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json", "dyn-symbols"] }
napi-derive = "2.16"
serde_json = "1.0"
parking_lot = "0.12"